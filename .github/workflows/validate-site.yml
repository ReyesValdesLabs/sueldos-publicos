name: Validate site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Diagnósticos
        run: pnpm check
      - name: Pruebas unitarias
        run: pnpm test
      - name: Pruebas de automatización
        run: pnpm test:automation
      - name: Compilar sitio
        run: pnpm build
      - name: Auditar HTML, enlaces y rastreo
        run: python3 scripts/audit-static-site.py
      - name: Verificar diferencias
        run: git diff --check
